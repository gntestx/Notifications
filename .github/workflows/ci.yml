name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Notifications.slnx
      - name: Build
        run: dotnet build Notifications.slnx --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/Notifications/Notifications.csproj --configuration Release --no-build --output publish

