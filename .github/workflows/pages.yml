name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/Notifications.Client/**"
      - "src/Notifications.Shared/**"
      - "Directory.*"
      - "global.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Configure API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL" || API_BASE_URL="https://notifications-api.azurewebsites.net/"
          jq --arg url "$API_BASE_URL" '.ApiBaseUrl = $url' \
            src/Notifications.Client/wwwroot/appsettings.json > /tmp/appsettings.json
          mv /tmp/appsettings.json src/Notifications.Client/wwwroot/appsettings.json

      - name: Publish
        run: dotnet publish src/Notifications.Client/Notifications.Client.csproj --configuration Release --output publish

      - name: Configure repository base path
        run: |
          BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE_PATH}\" />|" publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
