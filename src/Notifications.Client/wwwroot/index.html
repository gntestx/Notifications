<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F2A44" />
    <meta name="description" content="En Blazor PWA för att skicka och ta emot Web Push-notifikationer." />
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Notifications</title>
</head>
<body>
    <div id="app">
        <div class="loading-shell" role="status" aria-label="Laddar">
            <div class="loading-bell">●</div>
            <div class="loading-line"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ett oväntat fel inträffade.
        <a href="." class="reload">Ladda om</a>
        <button type="button" class="dismiss" aria-label="Stäng">×</button>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/push-notifications.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        navigator.serviceWorker?.register(new URL('service-worker.js', document.baseURI), { updateViaCache: 'none' });
    </script>
</body>
</html>
